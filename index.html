<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> الموقع مغلق موقتاً </title>
    
    <style>
        /* إعادة ضبط التنسيقات الأساسية */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* العداد التنازلي */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .time-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            min-width: 75px;
            border: 1px solid #334155;
        }

        .time-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: #f8fafc;
        }

        .time-box label {
            font-size: 0.85rem;
            color: #64748b;
        }

        /* نموذج البريد الإلكتروني */
        .subscribe-form {
            display: flex;
            gap: 10px;
            max-width: 450px;
            margin: 0 auto;
        }

        .subscribe-form input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .subscribe-form input:focus {
            border-color: #38bdf8;
        }

        .subscribe-form button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background-color: #0284c7;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .subscribe-form button:hover {
            background-color: #0369a1;
        }

        /* التكيف مع الشاشات الصغيرة */
        @media (max-width: 480px) {
            .subscribe-form {
                flex-direction: column;
            }
            .countdown {
                gap: 8px;
            }
            .time-box {
                min-width: 60px;
                padding: 10px;
            }
            .time-box span {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>الموقع مغلق موقتاً</h1>
        <p>نعمل حالياً على بناء شيء رائع ومميز. سنكون جاهزين للانطلاق قريباً جداً!</p>

        <!-- العداد التنازلي -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>يوم</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>ساعة</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>دقيقة</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>ثانية</label>
            </div>
        </div>

        <!-- نموذج إشعار عند الافتتاح -->
  
    </div>

    <script>
        // حدد تاريخ الافتتاح المتوقع هنا (مثال: بعد 30 يوماً من الآن)
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 999);

        function updateCountdown() {
            const currentTime = new Date();
            const difference = launchDate - currentTime;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((difference / 1000 / 60) % 60);
                const seconds = Math.floor((difference / 1000) % 60);

                document.getElementById('days').textContent = days < 10 ? '0' + days : days;
                document.getElementById('hours').textContent = hours < 10 ? '0' + hours : hours;
                document.getElementById('minutes').textContent = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById('seconds').textContent = seconds < 10 ? '0' + seconds : seconds;
            }
        }

        // تحديث العداد كل ثانية
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // التفاعل مع نموذج الاشتراك
        document.getElementById('notifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('شكراً لك! سنقوم بإبلاغك فور إطلاق الموقع.');
            this.reset();
        });
    </script>
</body>
</html>
